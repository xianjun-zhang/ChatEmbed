<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the ring - blue to purple/pink -->
    <linearGradient id="ringGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer ring with gradient -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#ringGradient)" stroke-width="20" />
  
  <!-- White inner circle background -->
  <circle cx="100" cy="100" r="80" fill="white" />
  
  <!-- User icon - with fully separated head and body -->
  <g transform="translate(100, 100)">
    <!-- Head - completely separated circle -->
    <circle cx="0" cy="-30" r="20" fill="#3B82F6" />
    
    <!-- Body - dome shape starting below head with clear gap -->
    <path d="M -40 40 
             C -40 40, -40 15, -35 5
             C -30 -5, -20 -5, 0 -5
             C 20 -5, 30 -5, 35 5
             C 40 15, 40 40, 40 40
             Z" 
          fill="#3B82F6" />
  </g>
</svg>